<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Gothic A1', sans-serif; color:#2B3440; background:#FFF9E4; }
  a { color:#2B3440; }
  a:hover { color:#8A6D00; }
  @keyframes oc-box-float {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-7px); }
  }
  @keyframes oc-puff {
    0%, 100% { opacity:0; }
    40%, 60% { opacity:1; }
  }
</style>
</helmet>

<div style="min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 24px;box-sizing:border-box;background:#FFF9E4">

  <div style="position:absolute;top:-90px;left:-70px;width:280px;height:280px;border-radius:50%;background:#FFC90E;opacity:.28"></div>
  <div style="position:absolute;bottom:-100px;right:-60px;width:320px;height:320px;border-radius:50%;background:#FFC90E;opacity:.28"></div>

  <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;max-width:640px">

    <svg viewBox="0 0 180 160" width="240" height="213" fill="none" style="animation:oc-box-float 3.4s ease-in-out infinite">
      <g stroke="#2B3440" stroke-width="5" stroke-linecap="round" style="animation:oc-puff 2.6s ease-in-out infinite">
        <path d="M58 36 L50 16"></path>
        <path d="M90 30 L90 8"></path>
        <path d="M122 36 L130 16"></path>
      </g>
      <g stroke="#2B3440" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="10 9">
        <rect x="14" y="52" width="152" height="96" rx="14"></rect>
        <circle cx="58" cy="90" r="14"></circle>
        <path d="M40 124 C40 108, 76 108, 76 124"></path>
        <path d="M98 88 L146 88"></path>
        <path d="M98 112 L132 112"></path>
      </g>
    </svg>

    <div style="display:flex;flex-direction:column;gap:10px">
      <h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;color:#2B3440">어라라.. 찾고 계신 프로필이 없는거 같네요...</h1>
      <p style="margin:0;font-size:15px;line-height:1.6;color:#6B7687">다른 프로필을 찾아 보시겠어요?</p>
    </div>

    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:4px">
      <a href="프로젝트OC 템플릿 둘러보기 - 템플릿 제작.dc.html" style="display:flex;align-items:center;height:48px;padding:0 24px;border-radius:12px;background:#FFC90E;border:1px solid #FFC90E;color:#2B3440;font-size:15px;font-weight:700;text-decoration:none;transition:filter .15s" style-hover="filter:brightness(.95);color:#2B3440">다른 프로필 둘러보기</a>
      <a href="프로젝트OC 로그인.dc.html" style="display:flex;align-items:center;height:48px;padding:0 24px;border-radius:12px;background:#fff;border:1px solid #D5DCE6;color:#2B3440;font-size:15px;font-weight:700;text-decoration:none;transition:background .15s,border-color .15s" style-hover="background:#F7F9FC;border-color:#B9C3D4;color:#2B3440">메인 페이지로 이동</a>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
