<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
  a{color:#8a8a8a;text-decoration:none}
  a:hover{color:#1a1a1a}
  input::placeholder{color:#b8b8b8}
  input:focus{outline:none}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @media (max-width:1023px){.oc-deco{display:none!important}}
</style>
</helmet>

<div style="min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <div class="oc-deco" style="position:absolute;left:-90px;top:120px;width:340px;height:340px;border-radius:50%;background:#FFC90E;opacity:.14;filter:blur(10px);animation:floaty 9s ease-in-out infinite"></div>
  <div class="oc-deco" style="position:absolute;left:110px;bottom:90px;width:120px;height:120px;border-radius:34px;background:#FFC90E;opacity:.55;transform:rotate(18deg)"></div>
  <div class="oc-deco" style="position:absolute;left:56px;bottom:250px;width:56px;height:56px;border-radius:50%;border:3px solid #FFC90E;opacity:.7"></div>
  <div class="oc-deco" style="position:absolute;right:-70px;bottom:60px;width:300px;height:300px;border-radius:50%;background:#FFC90E;opacity:.16;filter:blur(10px);animation:floaty 11s ease-in-out infinite"></div>
  <div class="oc-deco" style="position:absolute;right:130px;top:160px;width:150px;height:150px;border-radius:50%;background:#FFC90E;opacity:.5"></div>
  <div class="oc-deco" style="position:absolute;right:70px;top:360px;width:84px;height:84px;border-radius:24px;border:3px solid #FFC90E;opacity:.75;transform:rotate(-12deg)"></div>

  <header style="position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:22px 40px">
    <span style="width:18px;height:18px;border-radius:6px;background:#FFC90E;display:block"></span>
    <span style="font-size:17px;font-weight:800;letter-spacing:-.02em">프로젝트 OC</span>
  </header>

  <main style="position:relative;z-index:2;flex:1;display:flex;justify-content:center;padding:24px 24px 80px">
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column">

      <h1 style="margin:32px 0 0;font-size:44px;line-height:1.18;font-weight:800;letter-spacing:-.035em;text-wrap:pretty">프로젝트OC<br>로그인</h1>
      <p style="margin:18px 0 0;font-size:17px;line-height:1.6;color:#767676;text-wrap:pretty">다시 오신 것을 환영합니다! 창작할 준비가 되셨나요?</p>

      <hr style="width:100%;height:2px;border:0;background:#1a1a1a;margin:36px 0 32px">

      <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:22px">
        <label style="display:flex;flex-direction:column;gap:9px">
          <span style="font-size:14px;font-weight:600;color:#3d3d3d">사용자 이름</span>
          <input type="text" placeholder="사용자 이름을 입력하세요" style="width:100%;height:54px;padding:0 18px;border:1.5px solid #e4e4e4;border-radius:14px;font-size:15px;font-family:inherit;color:#1a1a1a;background:#fff;transition:border-color .15s,box-shadow .15s" style-focus="border-color:#FFC90E;box-shadow:0 0 0 4px rgba(255,201,14,.22)">
        </label>

        <label style="display:flex;flex-direction:column;gap:9px">
          <span style="font-size:14px;font-weight:600;color:#3d3d3d">사용자 비밀번호</span>
          <span style="position:relative;display:block">
            <input type="{{ pwType }}" placeholder="비밀번호를 입력하세요" style="width:100%;height:54px;padding:0 54px 0 18px;border:1.5px solid #e4e4e4;border-radius:14px;font-size:15px;font-family:inherit;color:#1a1a1a;background:#fff;transition:border-color .15s,box-shadow .15s" style-focus="border-color:#FFC90E;box-shadow:0 0 0 4px rgba(255,201,14,.22)">
            <button type="button" onClick="{{ togglePw }}" aria-label="비밀번호 표시 전환" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:#8a8a8a;cursor:pointer" style-hover="background:#f5f5f5;color:#1a1a1a">{{ eyeIcon }}</button>
          </span>
        </label>

        <button type="submit" style="margin-top:6px;height:54px;border:0;border-radius:14px;background:#FFC90E;color:#1a1a1a;font-size:16px;font-weight:800;font-family:inherit;letter-spacing:-.01em;cursor:pointer;box-shadow:0 6px 16px rgba(255,201,14,.35);transition:transform .12s,box-shadow .15s" style-hover="transform:translateY(-1px);box-shadow:0 10px 22px rgba(255,201,14,.45)" style-active="transform:translateY(0)">로그인</button>
      </form>

      <div style="display:flex;align-items:center;gap:14px;margin:30px 0 20px">
        <span style="flex:1;height:1px;background:#ececec"></span>
        <span style="font-size:12.5px;color:#a8a8a8">또는</span>
        <span style="flex:1;height:1px;background:#ececec"></span>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <button type="button" style="height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid #e4e4e4;border-radius:14px;background:#fff;font-size:15px;font-weight:600;font-family:inherit;color:#1a1a1a;cursor:pointer;transition:background .15s,border-color .15s" style-hover="background:#fafafa;border-color:#d4d4d4">
          <span style="width:20px;height:20px;border-radius:5px;background:#03C75A;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">N</span>
          네이버로 로그인
        </button>
        <button type="button" style="height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid #e4e4e4;border-radius:14px;background:#fff;font-size:15px;font-weight:600;font-family:inherit;color:#1a1a1a;cursor:pointer;transition:background .15s,border-color .15s" style-hover="background:#fafafa;border-color:#d4d4d4">
          <span style="width:20px;height:20px;border-radius:50%;border:1.5px solid #e0e0e0;color:#5f6368;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">G</span>
          구글로 로그인
        </button>
      </div>

      <p style="margin:34px 0 0;text-align:center;font-size:13px;color:#8a8a8a">
        <a href="/findacc" style="text-decoration:underline;text-underline-offset:3px">사용자 이름 또는 비밀번호를 잊으셨나요?</a>
      </p>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { show: false };
  renderVals() {
    const show = this.state.show;
    const e = React.createElement;
    const eyeIcon = e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' },
      e('path', { key: 'p', d: 'M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z' }),
      e('circle', { key: 'c', cx: 12, cy: 12, r: 3.2 }),
      show ? null : e('line', { key: 'l', x1: 4, y1: 20, x2: 20, y2: 4 })
    );
    return {
      pwType: show ? 'text' : 'password',
      eyeIcon,
      togglePw: () => this.setState(s => ({ show: !s.show })),
      onSubmit: (ev) => ev.preventDefault()
    };
  }
}
</script>
</body>
</html>
