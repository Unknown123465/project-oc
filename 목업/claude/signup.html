<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>회원가입 | 프로젝트 OC</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">OC</span><span>프로젝트 OC</span></a>
      <div class="main-nav" style="display:flex">
        <button class="theme-toggle" type="button" data-theme-toggle>어둡게 보기</button>
        <a class="btn btn-sm" href="login.html">로그인</a>
      </div>
    </div>
  </header>

  <main class="auth-page" id="main">
    <section class="auth-aside">
      <h1>몇 가지만 적으면<br>프로필 완성.</h1>
      <p>프로젝트 OC에 가입하고 첫 번째 캐릭터 프로필을 만들어 보세요. 기본 기능은 무료입니다.</p>
    </section>
    <section class="auth-form-wrap">
      <form class="auth-form" data-validate data-success="회원가입 정보를 확인했습니다." novalidate>
        <h2>회원가입</h2>
        <p>당신의 캐릭터를 소개할 준비를 시작합니다.</p>

        <div class="field">
          <label for="signup-email">이메일 주소</label>
          <input class="input" id="signup-email" name="email" type="email" autocomplete="email" placeholder="example@email.com" required>
          <p class="field-error">이메일 주소를 입력해 주세요.</p>
        </div>

        <div class="field">
          <label for="signup-name">사용자 이름</label>
          <input class="input" id="signup-name" name="username" autocomplete="username" minlength="2" maxlength="20" placeholder="2~20자로 입력하세요" required>
          <p class="field-error">사용자 이름을 입력해 주세요.</p>
        </div>

        <div class="field">
          <label for="signup-password">비밀번호</label>
          <div class="input-action">
            <input class="input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="20" placeholder="영문과 숫자를 조합해 주세요" required>
            <button type="button" data-password-toggle="signup-password" aria-pressed="false">보기</button>
          </div>
          <p class="field-help">6~20자의 영문과 숫자 조합</p>
          <p class="field-error">비밀번호를 입력해 주세요.</p>
        </div>

        <div class="field">
          <label for="signup-confirm">비밀번호 확인</label>
          <div class="input-action">
            <input class="input" id="signup-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="비밀번호를 다시 입력하세요" data-confirm-password="signup-password" required>
            <button type="button" data-password-toggle="signup-confirm" aria-pressed="false">보기</button>
          </div>
          <p class="field-error">비밀번호 확인을 입력해 주세요.</p>
        </div>

        <button class="btn btn-primary auth-submit" type="submit">회원가입</button>
        <p class="field-help" style="margin-top:16px">가입하면 프로젝트 OC의 이용 정책과 개인정보 처리방침에 동의하게 됩니다.</p>
      </form>
    </section>
  </main>
</body>
</html>
