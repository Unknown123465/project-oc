<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>프로필 둘러보기 | 프로젝트 OC</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">OC</span><span>프로젝트 OC</span></a>
      <button class="nav-menu-toggle" type="button" data-nav-toggle aria-expanded="false">메뉴</button>
      <nav class="main-nav" data-main-nav aria-label="주요 메뉴">
        <a class="nav-link" href="browse-guest.html" aria-current="page">프로필 둘러보기</a>
        <button class="theme-toggle" type="button" data-theme-toggle>어둡게 보기</button>
        <a class="btn btn-sm" href="login.html">로그인</a>
        <a class="btn btn-primary btn-sm" href="signup.html">회원가입</a>
      </nav>
    </div>
  </header>

  <main class="page-shell page-main" id="main">
    <header class="page-heading">
      <div><h1 class="page-title">프로필 둘러보기</h1><p class="subtitle">로그인하지 않아도 캐릭터를 감상하고 좋아요를 남길 수 있습니다.</p></div>
      <div class="actions"><a class="btn btn-primary" href="login.html">로그인하고 만들기</a></div>
    </header>

    <div class="toolbar">
      <label class="search-box"><span class="is-hidden">캐릭터 검색</span><input class="input" type="search" placeholder="이름이나 소개로 검색" data-search></label>
      <select class="select" aria-label="정렬" data-filter><option value="전체">인기순</option><option value="최신">최신순</option></select>
      <select class="select" aria-label="종족" data-filter><option>전체</option><option>인간</option><option>엘프</option><option>노바</option></select>
    </div>

    <section class="gallery-grid" aria-label="공개 캐릭터 프로필">
      <article class="profile-tile" data-card data-search-text="티아라 오늘도 내일도 화이팅 노바" data-categories="노바,최신">
        <a href="profile-square.html"><div class="tile-media" style="--tile-tint:#ffe8ef"><img src="assets/character-tiara.png" alt="티아라 캐릭터"></div><div class="tile-body"><h3>티아라</h3><div class="tile-meta"><span>노바</span><span class="tile-stats"><span>♥ 132</span><span>코멘트 21</span></span></div></div></a>
        <details class="tile-menu"><summary aria-label="티아라 메뉴">•••</summary><div class="tile-menu-popover"><button type="button" data-open-modal="guest-share" data-modal-name="티아라">공유</button><button type="button" data-copy="https://projectoc.example/profile/tiara">링크 복사</button></div></details>
      </article>
      <article class="profile-tile" data-card data-search-text="카이 고요한 밤의 기록 인간" data-categories="인간">
        <a href="profile-vertical.html"><div class="tile-media" style="--tile-tint:#e5edff;--tile-filter:hue-rotate(115deg) saturate(.72)"><img src="assets/character-tiara.png" alt="카이 캐릭터 샘플"></div><div class="tile-body"><h3>카이</h3><div class="tile-meta"><span>인간</span><span class="tile-stats"><span>♥ 87</span><span>코멘트 12</span></span></div></div></a>
      </article>
      <article class="profile-tile" data-card data-search-text="세라핀 숲의 약속 엘프" data-categories="엘프,최신">
        <a href="profile-horizontal.html"><div class="tile-media" style="--tile-tint:#e2f3e7;--tile-filter:hue-rotate(55deg) saturate(.76)"><img src="assets/character-tiara.png" alt="세라핀 캐릭터 샘플"></div><div class="tile-body"><h3>세라핀</h3><div class="tile-meta"><span>엘프</span><span class="tile-stats"><span>♥ 62</span><span>코멘트 8</span></span></div></div></a>
      </article>
      <article class="profile-tile" data-card data-search-text="노아 잊힌 별을 찾는 여행 인간" data-categories="인간">
        <a href="profile-card.html"><div class="tile-media" style="--tile-tint:#fff0ca"><div class="tile-placeholder">캐릭터 이미지 준비 중</div></div><div class="tile-body"><h3>노아</h3><div class="tile-meta"><span>인간</span><span class="tile-stats"><span>♥ 48</span><span>코멘트 9</span></span></div></div></a>
      </article>
    </section>
    <div class="empty-state is-hidden" data-filter-empty><div><h2>찾는 프로필이 없습니다.</h2><p>검색어나 필터를 바꿔 다시 찾아보세요.</p><div class="actions" style="justify-content:center"><button class="btn" type="button" data-reset-filters>필터 초기화</button></div></div></div>
  </main>

  <div class="dialog-backdrop" id="guest-share" aria-hidden="true">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="guest-share-title">
      <div class="dialog-head"><div><h2 id="guest-share-title">공유하기</h2><p><strong data-modal-character>캐릭터</strong> 프로필을 공유합니다.</p></div><button class="dialog-close" type="button" data-close-modal>×</button></div>
      <div class="share-grid"><button class="share-option" type="button" data-toast="X 공유 창을 준비했습니다.">X</button><button class="share-option" type="button" data-toast="카카오톡 공유 창을 준비했습니다.">카카오톡</button><button class="share-option" type="button" data-toast="인스타그램 공유 창을 준비했습니다.">인스타그램</button><button class="share-option" type="button" data-toast="페이스북 공유 창을 준비했습니다.">페이스북</button></div>
      <div class="copy-row"><input class="input" value="https://projectoc.example/profile/tiara" readonly><button class="btn btn-primary" type="button" data-copy="https://projectoc.example/profile/tiara">복사</button></div>
    </section>
  </div>
</body>
</html>
