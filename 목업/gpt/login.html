<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>로그인 | 프로젝트 OC</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">OC</span><span>프로젝트 OC</span></a>
      <div class="main-nav" style="display:flex">
        <button class="theme-toggle" type="button" data-theme-toggle>어둡게 보기</button>
        <a class="btn btn-primary btn-sm" href="signup.html">회원가입</a>
      </div>
    </div>
  </header>

  <main class="auth-page" id="main">
    <section class="auth-aside">
      <h1>다시 만난<br>당신의 캐릭터.</h1>
      <p>작성하던 프로필을 이어서 완성하고, 독자에게 도착한 좋아요와 코멘트를 확인하세요.</p>
    </section>
    <section class="auth-form-wrap">
      <form class="auth-form" data-validate data-success="로그인 정보를 확인했습니다." novalidate>
        <h2>로그인</h2>
        <p>다시 오신 것을 환영합니다.</p>

        <div class="field">
          <label for="username">사용자 이름</label>
          <input class="input" id="username" name="username" autocomplete="username" placeholder="사용자 이름을 입력하세요" required>
          <p class="field-error">사용자 이름을 입력해 주세요.</p>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-action">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
            <button type="button" data-password-toggle="password" aria-pressed="false">보기</button>
          </div>
          <p class="field-error">비밀번호를 입력해 주세요.</p>
        </div>

        <button class="btn btn-primary auth-submit" type="submit">로그인</button>
        <div class="divider">또는</div>
        <div class="social-buttons">
          <button class="btn" type="button" data-toast="네이버 로그인을 준비하고 있습니다.">네이버로 로그인</button>
          <button class="btn" type="button" data-toast="구글 로그인을 준비하고 있습니다.">구글로 로그인</button>
        </div>
        <div class="actions" style="justify-content:space-between;margin-top:24px">
          <a class="btn btn-quiet btn-sm" href="#" data-toast="계정 찾기 안내를 보냈습니다.">계정을 잊으셨나요?</a>
          <a class="btn btn-quiet btn-sm" href="signup.html">처음이신가요?</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
