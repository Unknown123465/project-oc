<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>비밀번호 재설정</title>
	</head>
	<body style="margin: 0; padding: 0; background-color: #f6f5f1">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f6f5f1">
			<tr>
				<td align="center" style="padding: 40px 16px">
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border: 1px solid #e4e1d8; border-radius: 16px">
						<tr>
							<td style="padding: 36px 32px 32px; font-family: &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif; color: #2b2925">
								<p style="margin: 0 0 24px; font-size: 14px; font-weight: 800">프로젝트 OC</p>

								<h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.4; letter-spacing: -0.02em">비밀번호 재설정</h1>

								<p style="margin: 0 0 28px; font-size: 15px; line-height: 1.7">{{userName}}님, 비밀번호를 다시 정하려면 아래 버튼을 눌러 주세요.</p>

								<a
									href="{{link}}"
									style="
										display: inline-block;
										padding: 13px 22px;
										background-color: #ffc90e;
										color: #2b2925;
										font-size: 15px;
										font-weight: 800;
										text-decoration: none;
										border-radius: 10px;
									"
									>비밀번호 재설정</a
								>

								<p style="margin: 28px 0 0; font-size: 13px; line-height: 1.7; color: #6f6b62">
									링크는 {{expiresMinutes}}분 동안 쓸 수 있어요. 직접 요청한 게 아니라면 이 메일은 무시해 주세요. 비밀번호는 그대로 남아 있어요.
								</p>

								<p style="margin: 16px 0 0; font-size: 12px; line-height: 1.6; color: #8d897f; word-break: break-all">
									버튼이 안 눌리면 이 주소를 브라우저에 붙여 넣어 주세요.<br />{{link}}
								</p>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
