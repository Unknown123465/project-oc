<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>계정 이메일 변경 알림</title>
	</head>
	<body style="margin: 0; padding: 0; background-color: #f6f5f1">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f6f5f1">
			<tr>
				<td align="center" style="padding: 40px 16px">
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border: 1px solid #e4e1d8; border-radius: 16px">
						<tr>
							<td style="padding: 36px 32px 32px; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #2b2925">
								<p style="margin: 0 0 24px; font-size: 14px; font-weight: 800">프로젝트 OC</p>

								<h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.4; letter-spacing: -0.02em">계정 이메일이 바뀌었어요</h1>

								<p style="margin: 0 0 8px; font-size: 15px; line-height: 1.7">{{userName}}님 계정의 이메일이 아래 주소로 바뀌었어요. 이제 이 주소로는 알림이 가지 않아요.</p>

								<p style="margin: 0 0 4px; font-size: 15px; line-height: 1.7; font-weight: 700">{{newEmail}}</p>

								<p style="margin: 0 0 28px; font-size: 13px; line-height: 1.7; color: #6f6b62">바뀐 시각: {{changedAt}}</p>

								<p style="margin: 0 0 20px; font-size: 15px; line-height: 1.7">직접 바꾼 게 아니라면 바로 로그인해서 비밀번호를 바꿔 주세요. 비밀번호를 바꾸면 다른 기기에 남아 있던 로그인도 전부 풀려요.</p>

								<a href="{{loginLink}}" style="display: inline-block; padding: 13px 22px; background-color: #ffc90e; color: #2b2925; font-size: 15px; font-weight: 800; text-decoration: none; border-radius: 10px">로그인하기</a>

								<p style="margin: 28px 0 0; font-size: 13px; line-height: 1.7; color: #6f6b62">직접 바꾼 거라면 이 메일은 확인만 하고 넘기셔도 돼요.</p>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
